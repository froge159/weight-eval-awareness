# Phase 1 step 1 -- full run on the Wood Labs organism.
#
# Requires the 49B: ~100GB in bf16, so multi-GPU or an H200. Hua et al. note the
# base model fits on a single H200.

model_id: timhua/wood_v2_sftr4_filt
revision: main
dtype: bfloat16
device_map: auto

# Where r_hat is estimated from -- independent of the model edited in Phase 2.
# Hua et al.'s own configs use adapter_name: null (the BASE model) for their
# main steering vectors, deliberately, so the vector cannot encode type-hint
# information. See RESEARCH_DECISIONS.md 2026-08-08T13:10Z -- this is an open
# group decision and "both" is the recommended setting.
extraction_source: organism
base_model_id: nvidia/Llama-3_3-Nemotron-Super-49B-v1

# Direction must replicate under both cue regimes before Phase 2 edits anything.
regimes: [explicit, woodlabs]

# Load-bearing: Hua et al. Figures 34-36 show the gap is much weaker without
# the situational awareness hint. Setting this false risks a false-negative
# "no gap" result caused purely by prompt formatting.
situational_awareness_hint: true

questions_path: data/questions.jsonl

seed: 0
template_fractions: [0.6, 0.2, 0.2]
question_fractions: [0.6, 0.2, 0.2]

# last_prompt_token is captured at offset -2, matching their configs (not -1).
pooling_schemes: [completion_mean]
max_new_tokens: 3072      # organism averages ~1300 tokens; truncating would defeat completion_mean
temperature: 0.0
layers: [4, 8, 12, 16, 20, 24, 28, 32, 36, 40, 44, 48, 52, 56, 60, 64, 68, 72, 76, 80]
batch_size: 1
cache_dir: cache/activations

n_boot: 2000
layer_band_prior: [10, 30]        # Hua et al. Appendix G.1
stability_threshold_multiplier: 20.0

allow_deferred_refusal: true      # step 3b is another workstream's
require_gap_before_extraction: true

output_dir: outputs_cm
