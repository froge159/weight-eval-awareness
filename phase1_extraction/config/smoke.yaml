# Smoke-test config: exercises the whole step 1 pipeline on a tiny model.
#
# Not a substitute for the 49B run -- the point is that every stage executes and
# every gate fires before you spend GPU-hours. Use with --dry-run to check
# prompts and splits with no model at all.

model_id: Qwen/Qwen2.5-0.5B-Instruct
revision: main
dtype: float32
device_map: cpu

extraction_source: organism
regimes: [explicit]
situational_awareness_hint: true

questions_path: data/questions_smoke.jsonl

seed: 0
template_fractions: [0.6, 0.2, 0.2]
question_fractions: [0.6, 0.2, 0.2]

pooling_schemes: [last_prompt_token]
max_new_tokens: 64
temperature: 0.0
layers: [0, 4, 8, 12]
batch_size: 1
cache_dir: cache/activations_smoke

n_boot: 200
layer_band_prior: [4, 12]
stability_threshold_multiplier: 20.0

allow_deferred_refusal: true
require_gap_before_extraction: false

output_dir: outputs_smoke
